<title>The Bat Cave</title>

<style>
:root{
  --bg:#07080A; --stone:#11141A; --stone-2:#181C24; --line:#2A313C;
  --text:#ECE6D6; --dim:#8E9199; --gold:#D9A441; --ember:#F2C14E;
  --trip:#4FA3A5; --album:#C8553D; --bad:#E5694F;
  --display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --body:'Spectral',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;}
body{overflow-x:hidden;}
button{font-family:inherit;color:inherit;}

/* ---------- cave atmosphere ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(1100px 700px at 50% -12%,rgba(217,164,65,.17),transparent 62%),
    radial-gradient(800px 600px at 110% 110%,rgba(79,163,165,.10),transparent 60%),
    radial-gradient(700px 600px at -20% 100%,rgba(200,85,61,.08),transparent 60%),
    linear-gradient(180deg,#0B0D11 0%,#07080A 60%,#050607 100%);}
#bg .rock{position:absolute;inset:0;opacity:.5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
#bg .beam{position:absolute;left:50%;top:-10%;width:130vmax;height:120vmax;transform:translateX(-50%);
  background:conic-gradient(from 180deg at 50% 0%,transparent 163deg,rgba(242,193,78,.07) 175deg,rgba(242,193,78,.12) 180deg,rgba(242,193,78,.07) 185deg,transparent 197deg);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 80%);mask-image:linear-gradient(180deg,#000 0%,transparent 80%);
  animation:beam 9s ease-in-out infinite alternate;}
@keyframes beam{from{opacity:.55;}to{opacity:1;}}
#bg .mist{position:absolute;left:-30%;width:160%;height:38vh;bottom:-6vh;opacity:.5;filter:blur(24px);
  background:radial-gradient(closest-side,rgba(120,140,160,.20),transparent);animation:drift 26s linear infinite alternate;}
#bg .mist.b{bottom:12vh;opacity:.28;animation-duration:38s;animation-direction:alternate-reverse;}
@keyframes drift{from{transform:translateX(-8%);}to{transform:translateX(8%);}}
#bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%);}
.flit{position:absolute;top:18%;left:-12%;width:26px;height:12px;opacity:0;color:#000;animation:flit 19s linear infinite;}
.flit.two{top:30%;animation-delay:9s;animation-duration:24s;width:20px;}
@keyframes flit{0%{transform:translate(0,0);opacity:0;}6%{opacity:.8;}50%{transform:translate(60vw,-6vh);}94%{opacity:.8;}100%{transform:translate(125vw,8vh);opacity:0;}}

/* ---------- login gate ---------- */
#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));text-align:center;}
.emblem{width:min(46vw,190px);height:auto;margin-bottom:6px;animation:sway 7s ease-in-out infinite,fadein 1.2s .1s both;transform-origin:50% 0;
  filter:drop-shadow(0 8px 22px rgba(217,164,65,.28));}
@keyframes sway{0%,100%{transform:rotate(-1.6deg);}50%{transform:rotate(1.6deg);}}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.rune{width:min(88vw,540px);color:var(--ember);margin:18px 0 10px;filter:drop-shadow(0 0 10px rgba(242,193,78,.55)) drop-shadow(0 0 28px rgba(217,164,65,.35));
  animation:wipe 3.2s .5s cubic-bezier(.6,.05,.2,1) both;}
.rune svg{display:block;width:100%;height:auto;}
@keyframes wipe{from{clip-path:inset(-60px 100% -60px -60px);opacity:.2;}to{clip-path:inset(-60px -60px -60px -60px);opacity:1;}}
.caption{font-family:var(--display);font-weight:700;letter-spacing:.38em;font-size:13px;color:var(--dim);text-transform:uppercase;
  animation:fadein 1.4s 2.6s both;padding-left:.38em;}
.cta{margin-top:34px;animation:rise .8s 2.9s both;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 30px;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#E8B753,#C9922F);color:#16110A;border:none;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.08em;
  text-transform:uppercase;box-shadow:0 10px 30px rgba(217,164,65,.25),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .2s;}
.btn:active{transform:scale(.95);box-shadow:0 4px 14px rgba(217,164,65,.2);}
.btn svg{width:22px;height:22px;fill:currentColor;}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);box-shadow:none;font-size:16px;min-height:44px;padding:0 18px;letter-spacing:.1em;}
.gate-msg{max-width:320px;line-height:1.5;color:var(--dim);margin-top:16px;font-size:15px;}
.gate-msg.err{color:var(--bad);}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* ---------- hub ---------- */
#app{display:none;position:relative;z-index:5;min-height:100%;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;animation:rise .6s both;}
.brand{display:flex;align-items:center;gap:12px;}
.brand svg{width:34px;height:34px;}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.12em;text-transform:uppercase;line-height:1;}
.view{display:none;flex:1;flex-direction:column;}
.view.on{display:flex;animation:slide .35s cubic-bezier(.2,.8,.2,1) both;}
.view.back.on{animation-name:slideback;}
@keyframes slide{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
@keyframes slideback{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:none;}}
.tiles{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:flex-end;min-height:0;}
.tile{--c:var(--gold);position:relative;flex:1;min-height:150px;max-height:300px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;
  text-align:left;border-radius:22px;padding:24px 24px 22px;cursor:pointer;overflow:hidden;border:1px solid var(--line);
  background:
    radial-gradient(420px 220px at 100% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),
    linear-gradient(160deg,var(--stone-2),var(--stone));
  transition:transform .14s,border-color .2s,box-shadow .2s;animation:rise .6s both;box-shadow:0 14px 34px rgba(0,0,0,.45);}
.tile:nth-child(1){animation-delay:.12s;} .tile:nth-child(2){animation-delay:.24s;} .tile:nth-child(3){animation-delay:.36s;} .tile:nth-child(4){animation-delay:.48s;}
.tile:active{transform:scale(.97);border-color:var(--c);box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 0 1px var(--c);}
.tile .ic{position:absolute;right:20px;top:20px;width:56px;height:56px;color:var(--c);opacity:.95;}
.tile .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.tile .name{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:.95;letter-spacing:.03em;text-transform:uppercase;}
.tile .sub{color:var(--dim);font-size:16px;}
.tile .go{position:absolute;right:22px;bottom:20px;font-size:30px;color:var(--c);transition:transform .2s;}
.tile:active .go{transform:translateX(5px);}
.signout{align-self:center;margin-top:20px;animation:rise .6s .6s both;}
.sub-head{margin:4px 2px 18px;animation:rise .5s both;}
.sub-head .kicker{font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:13px;color:var(--dim);text-transform:uppercase;}
.sub-head h2{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,64px);line-height:.95;text-transform:uppercase;letter-spacing:.03em;margin-top:6px;}
.back-bar{margin-top:20px;display:flex;}
.back-btn{flex:1;min-height:64px;border-radius:18px;background:var(--stone-2);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s;}
.back-btn:active{transform:scale(.97);}
.note{padding:46px 12px;text-align:center;color:var(--dim);line-height:1.6;}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--stone-2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;font-size:15px;}
#toast.on{opacity:1;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;}}
</style>
</head>
<body>

<div id="bg">
  <div class="rock"></div><div class="beam"></div>
  <div class="mist"></div><div class="mist b"></div>
  <svg class="flit" viewBox="0 0 30 14" fill="currentColor"><path d="M15 6c-2-3-5-5-9-4 2 1 3 3 3 5-2-1-5-1-8 1 3 0 5 1 6 3 1-2 3-3 5-1 1-2 2-2 3 0 2-2 4-1 5 1 1-2 3-3 6-3-3-2-6-2-8-1 0-2 1-4 3-5-4-1-7 1-9 4z"/></svg>
  <svg class="flit two" viewBox="0 0 30 14" fill="currentColor"><path d="M15 6c-2-3-5-5-9-4 2 1 3 3 3 5-2-1-5-1-8 1 3 0 5 1 6 3 1-2 3-3 5-1 1-2 2-2 3 0 2-2 4-1 5 1 1-2 3-3 6-3-3-2-6-2-8-1 0-2 1-4 3-5-4-1-7 1-9 4z"/></svg>
  <div class="vig"></div>
</div>

<!-- ============ LOGIN ============ -->
<main id="gate"><div class="spinner"></div></main>

<!-- ============ HUB ============ -->
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="#D9A441" stroke-width="3"/><circle cx="20" cy="20" r="16" fill="none" stroke="#F2C14E" stroke-width="1" opacity=".6"/></svg>
      <h1>Bat Cave</h1>
    </div>
  </header>
  <section class="view on" id="v-home"><div class="tiles" id="homeTiles"></div></section>
  <section class="view" id="v-sub">
    <div class="sub-head"><div class="kicker">The Bat Cave</div><h2 id="subTitle"></h2></div>
    <div class="tiles" id="subTiles"></div>
    <div class="back-bar"><button class="back-btn" onclick="goHome()"><span>&#8592;</span> Back</button></div>
  </section>
  <button class="btn ghost signout" onclick="signOut()">Sign out</button>
</div>
<div id="toast"></div>

  route:'<svg viewBox="0 0 48 48"><circle cx="12" cy="36" r="4"/><circle cx="36" cy="12" r="4"/><path d="M16 36h14a6 6 0 0 0 0-12H18a6 6 0 0 1 0-12h14"/></svg>',

};
const ACCENTS=['var(--trip)','var(--album)','var(--gold)','var(--ember)'];

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2800);}
function setGate(html){$('gate').innerHTML=html;$('gate').style.display='flex';$('app').style.display='none';}
function urlAuthError(){
  const p=new URLSearchParams((location.hash||'').replace(/^#/,'')||(location.search||'').replace(/^\?/,''));
  const e=p.get('error_description')||p.get('error');
  return e?decodeURIComponent(e.replace(/\+/g,' ')):null;
}

function loginGate(){
  const err=urlAuthError(), standalone=window.navigator.standalone===true;
  setGate(EMBLEM
    +'<div class="rune">'+RUNE_SVG+'</div>'
    +'<div class="caption">One app to rule them all</div>'
    +'<div class="cta"><button class="btn" onclick="signIn()">'+GITHUB+'Enter the Cave</button></div>'
    +(err?'<p class="gate-msg err">Login didn’t complete: '+esc(err)+'</p>':'')
    +(standalone?'<p class="gate-msg">Tip: if login loops from the home-screen icon, sign in once from Safari at this same address, then reopen the app.</p>':''));
}

async function signIn(){
  await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.origin+location.pathname}});
}
async function signOut(){await sb.auth.signOut();location.hash='';location.reload();}

async function boot(){
  if(booting)return; booting=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){loginGate();return;}
    const u=session.user.user_metadata||{};
    if((u.user_name||u.preferred_username||'').toLowerCase()!==OWNER){
      await sb.auth.signOut();
      setGate(EMBLEM+'<div class="caption" style="margin-top:18px">Not on the list</div><p class="gate-msg">This GitHub account is not authorised.</p><div class="cta" style="animation-delay:0s"><button class="btn" onclick="signIn()">Try another account</button></div>');
      return;
    }
    $('gate').style.display='none';$('app').style.display='flex';
    $('homeTiles').innerHTML='<div class="note"><div class="spinner" style="margin:0 auto 14px"></div>Opening the cave…</div>';
    try{await load();}catch(e){$('homeTiles').innerHTML='<div class="note">Couldn’t load your apps.<br>'+esc(e.message||e)+'<br><br><button class="btn ghost" onclick="retry()">Retry</button></div>';return;}
    route();
  }finally{booting=false;}
}
function retry(){boot();}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')boot();});
window.addEventListener('hashchange',()=>{if($('app').style.display==='flex'&&LINKS.length)route(true);});
boot();

async function load(){
  const {data,error}=await sb.from('cave_links').select('*').order('sort_order',{ascending:true}).order('id',{ascending:true});
  if(error)throw error; LINKS=data||[];
}

function safeUrl(u){return typeof u==='string'&&/^https:\/\//i.test(u)?u:null;}
function childrenOf(id){return LINKS.filter(l=>l.parent_id===id);}

function tileHtml(l,i){
  const kids=childrenOf(l.id).length, url=safeUrl(l.url);
  const action=kids?'openSub('+l.id+')':(url?'openApp('+l.id+')':'');
  const accent=ACCENTS[i%ACCENTS.length];
  return '<button class="tile" style="--c:'+accent+'" '+(action?'onclick="'+action+'"':'disabled')+'>'
    +'<span class="ic">'+(ICONS[l.icon]||ICONS.default)+'</span>'
    +'<span class="name">'+esc(l.label)+'</span>'
    +(l.subtitle?'<span class="sub">'+esc(l.subtitle)+'</span>':'')
    +'<span class="go">&#8594;</span></button>';
}

function renderHome(){
  const top=LINKS.filter(l=>l.parent_id==null);
  $('homeTiles').innerHTML=top.length?top.map(tileHtml).join(''):'<div class="note">No apps yet.<br>Add rows to <b>cave_links</b> in Supabase.</div>';
}
function renderSub(id){
  const p=LINKS.find(l=>l.id===id); if(!p){goHome();return;}
  $('subTitle').textContent=p.label;
  const kids=childrenOf(id);
  $('subTiles').innerHTML=kids.length?kids.map((k,i)=>tileHtml(k,i)).join(''):'<div class="note">Nothing in here yet.</div>';
}
function show(v,back){
  ['home','sub'].forEach(n=>{const el=$('v-'+n);el.classList.toggle('on',n===v);el.classList.toggle('back',!!back);});
  window.scrollTo(0,0);
}
function route(back){
  const m=/^#\/(\d+)$/.exec(location.hash||'');
  if(m){renderSub(+m[1]);show('sub',back);}
  else{renderHome();show('home',back);}
}
function openSub(id){location.hash='#/'+id;}
function goHome(){if(location.hash){history.length>1?history.back():(location.hash='');}else route(true);}
function openApp(id){
  const l=LINKS.find(x=>x.id===id), url=l&&safeUrl(l.url);
  if(!url){toast('No link set');return;}
  location.href=url;
}
</script>
</body>
</html>
